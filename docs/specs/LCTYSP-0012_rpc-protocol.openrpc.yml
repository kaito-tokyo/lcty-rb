# The methods of the RPC protocol (LCTYSP-0012), as an OpenRPC document written in YAML so that it can hold comments.
# This file is the source: the server reads it at startup and answers rpc.discover with it as JSON. The rules that a
# method list cannot say (the global version, the order of notifications, Origin, sending again, finishing a reply) are
# in LCTYSP-0012_rpc-protocol.md.
#
# Both ends speak the same protocol. Which methods an end receives is not fixed here: each end declares it in
# initialize (capabilities.receives), and the other end sends only those. x-receiver says which end usually receives a
# method: "server" for what a page calls, "page" for the notifications the server sends.

openrpc: "1.3.2"
info:
  title: lcty-rb RPC
  version: "0.1.0" # prototype
  description: JSON-RPC 2.0 at /v1/rpc, over a WebSocket (LCTYSP-0012)
servers:
  - name: site
    url: /v1/rpc # relative to LCTY_BASE_URL

methods:
  # ---- Session ----

  - name: initialize
    x-receiver: server
    summary: Start a session and exchange capabilities
    description: >-
      The first request on a connection. The page says which methods it receives; the answer says which methods the
      server receives, the current global version, and the actorId assigned to this connection. Until then the server
      sends the page no notification.
    paramStructure: by-name
    params:
      - name: protocol
        schema:
          type: string
      - name: capabilities
        schema:
          $ref: "#/components/schemas/Capabilities"
    result:
      name: session
      schema:
        type: object
        required: [protocol, version, actorId, capabilities]
        properties:
          protocol:
            type: string
            const: lcty-rpc-prototype
          version:
            $ref: "#/components/schemas/Version"
          actorId:
            description: >-
              The actor this connection is: every notification of a change it makes carries this id. The same for the
              whole connection.
            $ref: "#/components/schemas/ActorId"
          capabilities:
            $ref: "#/components/schemas/Capabilities"

  - name: rpc.discover
    x-receiver: server
    summary: This document, as JSON (OpenRPC service discovery)
    params: []
    result:
      name: document
      schema:
        type: object

  # ---- Conversations (LCTYSP-0013) ----

  - name: c.create
    x-receiver: server
    summary: Create a conversation file (lines 1 to 4)
    paramStructure: by-name
    params:
      - name: cid
        required: true
        schema:
          $ref: "#/components/schemas/Cid"
      - name: createdAt
        required: true
        schema:
          $ref: "#/components/schemas/Time"
      - name: title
        required: true
        description: The server fits it into the slot (LCTYSP-0003)
        schema:
          type: string
      - name: lang
        required: true
        description: >-
          <html lang> of line 1, and the language file line 2 loads (lcty.<version>.lang-<lang>.js). For en no
          language file is loaded: English is built into lcty.<version>.js.
        schema:
          type: string
          pattern: "^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$"
      - name: titleMaxSize
        required: true
        description: The bytes of the title slot on line 3 (written into its id, __<size>)
        schema:
          type: integer
          minimum: 16
          maximum: 4096
      - name: lctyVersion
        required: true
        description: The version of the lcty.* files the head loads (lcty.<version>.js, …)
        schema:
          type: string
          enum: [v1]
    result:
      name: change
      schema:
        $ref: "#/components/schemas/Change"
    errors:
      - $ref: "#/components/errors/Invalid"
      - $ref: "#/components/errors/Exists"

  - name: c.append.msg
    x-receiver: server
    summary: Append one lcty-msg after the element named
    paramStructure: by-name
    params:
      - name: cid
        required: true
        schema:
          $ref: "#/components/schemas/Cid"
      - name: after
        required: true
        description: The id of the last element as the page knows it; null for the first element
        schema:
          oneOf:
            - $ref: "#/components/schemas/ElementId"
            - type: "null"
      - name: attrs
        required: true
        description: data-role, id, data-at, data-template, data-tag, data-content-integrity, data-content or data-content-base64, in that order
        schema:
          $ref: "#/components/schemas/Attrs"
      - name: innerHTML
        required: true
        description: The presentation, one <article>
        schema:
          type: string
    result:
      name: written
      schema:
        allOf:
          - $ref: "#/components/schemas/Change"
          - type: object
            required: [attrs]
            properties:
              attrs:
                description: The attributes written, with data-content-integrity filled in for the placeholder
                $ref: "#/components/schemas/Attrs"
    errors:
      - $ref: "#/components/errors/Conflict"
      - $ref: "#/components/errors/Locked"
      - $ref: "#/components/errors/Invalid"
      - $ref: "#/components/errors/NotFound"
      - $ref: "#/components/errors/Former"

  - name: c.append.thinking
    x-receiver: server
    summary: Append one lcty-thinking after the element named
    paramStructure: by-name
    params:
      - name: cid
        required: true
        schema:
          $ref: "#/components/schemas/Cid"
      - name: after
        required: true
        description: The id of the last element as the page knows it; null for the first element
        schema:
          oneOf:
            - $ref: "#/components/schemas/ElementId"
            - type: "null"
      - name: attrs
        required: true
        description: id, data-at, data-content-integrity, data-content or data-content-base64, in that order
        schema:
          $ref: "#/components/schemas/Attrs"
      - name: innerHTML
        required: true
        description: The presentation, one <article>
        schema:
          type: string
    result:
      name: written
      schema:
        allOf:
          - $ref: "#/components/schemas/Change"
          - type: object
            required: [attrs]
            properties:
              attrs:
                description: The attributes written, with data-content-integrity filled in for the placeholder
                $ref: "#/components/schemas/Attrs"
    errors:
      - $ref: "#/components/errors/Conflict"
      - $ref: "#/components/errors/Locked"
      - $ref: "#/components/errors/Invalid"
      - $ref: "#/components/errors/NotFound"
      - $ref: "#/components/errors/Former"

  - name: c.append.cmd
    x-receiver: server
    summary: Append the lcty-cmd, the lock of the conversation (it has no presentation)
    paramStructure: by-name
    params:
      - name: cid
        required: true
        schema:
          $ref: "#/components/schemas/Cid"
      - name: after
        required: true
        description: The id of the last element as the page knows it; null for the first element
        schema:
          oneOf:
            - $ref: "#/components/schemas/ElementId"
            - type: "null"
      - name: attrs
        required: true
        description: id, data-op, data-at, data-error, in that order
        schema:
          $ref: "#/components/schemas/Attrs"
    result:
      name: written
      schema:
        allOf:
          - $ref: "#/components/schemas/Change"
          - type: object
            required: [attrs]
            properties:
              attrs:
                description: The attributes written, with data-content-integrity filled in for the placeholder
                $ref: "#/components/schemas/Attrs"
    errors:
      - $ref: "#/components/errors/Conflict"
      - $ref: "#/components/errors/Locked"
      - $ref: "#/components/errors/Invalid"
      - $ref: "#/components/errors/NotFound"
      - $ref: "#/components/errors/Former"

  - name: c.unappend
    x-receiver: server
    summary: Remove the last element, which must have the id given
    paramStructure: by-name
    params:
      - name: cid
        required: true
        schema:
          $ref: "#/components/schemas/Cid"
      - name: id
        required: true
        schema:
          $ref: "#/components/schemas/ElementId"
    result:
      name: change
      schema:
        $ref: "#/components/schemas/Change"
    errors:
      - $ref: "#/components/errors/Conflict"
      - $ref: "#/components/errors/NotFound"
      - $ref: "#/components/errors/Former"

  - name: c.subscribe
    x-receiver: server
    summary: Follow the elements of one conversation, replacing what the connection followed
    description: >-
      A page follows one conversation at a time: the c_html records of c.batch.updated are sent only to the
      connections that follow their conversation. cid null stops following. The result tells whether the page's last element is still
      the last one; when it is not, the page reads the conversation again. WebSocket only.
    paramStructure: by-name
    params:
      - name: cid
        required: true
        schema:
          oneOf:
            - $ref: "#/components/schemas/Cid"
            - type: "null"
      - name: last
        required: true
        description: The id of the last element the page holds (null when it holds none)
        schema:
          oneOf:
            - $ref: "#/components/schemas/ElementId"
            - type: "null"
    result:
      name: subscription
      schema:
        type: object
        required: [version, last, current]
        properties:
          version:
            description: The version right before the first notification this subscription gets
            $ref: "#/components/schemas/Version"
          last:
            description: The id of the last element of the conversation now (null when it has none)
            oneOf:
              - $ref: "#/components/schemas/ElementId"
              - type: "null"
          current:
            description: Whether the page's last element is the last one now
            type: boolean
    errors:
      - $ref: "#/components/errors/NotFound"

  - name: c.list
    x-receiver: server
    summary: The meta of every conversation, newest first
    description: >-
      What a page reads to fill its list of conversations, and again after reconnecting. The version is taken together
      with the list, so the page follows the c_meta records of c.batch.updated from it.
    params: []
    result:
      name: listing
      schema:
        type: object
        required: [version, items]
        properties:
          version:
            $ref: "#/components/schemas/Version"
          items:
            type: array
            items:
              $ref: "#/components/schemas/Meta"

  - name: c.recordcount.list
    x-receiver: server
    summary: Every cached count of elements, by cid
    description: >-
      What a page reads to fill its c_recordcount (LCTYSP-0014), and again after reconnecting: every row of the server's
      cache, ordered by cid. A conversation the cache has no count for is not among them, and its count is unknown. The
      version is taken together with the rows, so the page follows the c_recordcount records of c.batch.updated from it.
    params: []
    result:
      name: counts
      schema:
        type: object
        required: [version, items]
        properties:
          version:
            $ref: "#/components/schemas/Version"
          items:
            type: array
            items:
              $ref: "#/components/schemas/RecordCount"

  - name: t.c.list
    x-receiver: server
    summary: Which conversations each tag has
    description: >-
      What a page reads to fill t_has_many_c of lcty_t (LCTYSP-0014), and again after reconnecting: every row of
      t_has_many_c in lcty_t.sqlite, one per tag and conversation, each conversation's in the order its tags were given.
      A conversation with no row has no tags. The version is taken together with the rows, so the page follows the
      records of t.batch.updated from it.
    params: []
    result:
      name: rows
      schema:
        type: object
        required: [version, items]
        properties:
          version:
            $ref: "#/components/schemas/Version"
          items:
            type: array
            items:
              $ref: "#/components/schemas/TagHasC"

  - name: c.stats.put
    x-receiver: server
    summary: Record what was measured of a reply
    description: >-
      timings, usage and client of a reply, which LCTYSP-0013 keeps out of the conversation file, go to lcty_c.sqlite,
      keyed by the id of the reply's model lcty-msg; what was recorded for it is replaced. It may be sent before or
      after the reply is appended. It is a change with a version, announced by c.batch.updated with a c_stats record
      that goes only to the connections following the conversation; no database of the browser keeps it, so the pages
      read the others with c.stats.list. Unappending the reply forgets it.
    paramStructure: by-name
    params:
      - name: cid
        required: true
        schema:
          $ref: "#/components/schemas/Cid"
      - name: id
        required: true
        schema:
          description: msg-m- and a UUIDv7, the id of the reply
          type: string
      - name: timings
        schema:
          type: [object, "null"]
      - name: usage
        schema:
          type: [object, "null"]
      - name: client
        schema:
          type: [object, "null"]
    result:
      name: recorded
      schema:
        type: object
        required: [version]
        properties:
          version:
            $ref: "#/components/schemas/Version"
    errors:
      - $ref: "#/components/errors/Invalid"
      - $ref: "#/components/errors/NotFound"

  - name: c.stats.list
    x-receiver: server
    summary: What was measured of every reply of a conversation
    paramStructure: by-name
    params:
      - name: cid
        required: true
        schema:
          $ref: "#/components/schemas/Cid"
    result:
      name: stats
      schema:
        type: object
        required: [items]
        properties:
          items:
            description: Ordered by id; timings, usage and client are null when not measured
            type: array
            items:
              type: object
              required: [id, timings, usage, client]
              properties:
                id:
                  type: string
                timings:
                  type: [object, "null"]
                usage:
                  type: [object, "null"]
                client:
                  type: [object, "null"]
    errors:
      - $ref: "#/components/errors/NotFound"

  - name: c.update.title
    x-receiver: server
    summary: Change the title of a conversation
    description: >-
      The server fits the title into the slot (LCTYSP-0003) and answers the title as written. The slot is in the middle
      of the file, so no id guards it: the last title written wins. Allowed while an lcty-cmd holds the conversation.
    paramStructure: by-name
    params:
      - name: cid
        required: true
        schema:
          $ref: "#/components/schemas/Cid"
      - name: title
        required: true
        schema:
          type: string
    result:
      name: written
      schema:
        allOf:
          - $ref: "#/components/schemas/Change"
          - type: object
            required: [title]
            properties:
              title:
                description: The title as written into the slot
                type: string
    errors:
      - $ref: "#/components/errors/Invalid"
      - $ref: "#/components/errors/NotFound"

  - name: c.cmd.held
    x-receiver: server
    summary: Whether some connected page holds the lcty-cmd
    description: >-
      The server keeps no record of who holds an lcty-cmd: it asks every other connected page that receives
      c.cmd.holds and waits for their answers (2 s in the prototype). A page that does not answer in time counts as not
      holding it. When none holds it, the page asks the user whether to run it again or remove it.
    paramStructure: by-name
    params:
      - name: cid
        required: true
        schema:
          $ref: "#/components/schemas/Cid"
      - name: id
        required: true
        schema:
          $ref: "#/components/schemas/ElementId"
    result:
      name: holder
      schema:
        type: object
        required: [held, actorId]
        properties:
          held:
            type: boolean
          actorId:
            description: The actor of the page that holds it, or null
            oneOf:
              - $ref: "#/components/schemas/ActorId"
              - type: "null"
    errors:
      - $ref: "#/components/errors/NotFound"

  # ---- Requests the server sends (with an id: the page answers) ----

  - name: c.cmd.holds
    x-receiver: page
    summary: Whether this page holds the lcty-cmd (asked for c.cmd.held)
    paramStructure: by-name
    params:
      - name: cid
        required: true
        schema:
          $ref: "#/components/schemas/Cid"
      - name: id
        required: true
        schema:
          $ref: "#/components/schemas/ElementId"
    result:
      name: answer
      schema:
        type: object
        required: [holds]
        properties:
          holds:
            type: boolean

  # ---- Notifications the server sends (no result: always sent without an id) ----

  - name: c.batch.updated
    x-receiver: page
    summary: A change of c/, as the records of every copy it changes
    description: >-
      The one notification of every change of c/ (LCTYSP-0014): one change, one version, one c.batch.updated. Its
      records are in the order they are applied. c_html records are sent only to the connections that follow their
      conversation (c.subscribe), the others to every connection that receives c.batch.updated; a connection left with
      no record gets nothing.
    paramStructure: by-name
    params:
      - name: version
        required: true
        schema:
          $ref: "#/components/schemas/Version"
      - name: actorId
        required: true
        description: The actor that made the change (its connection's actorId), or null for a change through the HTTP API
        schema:
          oneOf:
            - $ref: "#/components/schemas/ActorId"
            - type: "null"
      - name: records
        required: true
        schema:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Record"

  - name: t.batch.updated
    x-receiver: page
    summary: A change of the tags of conversations, as the records of t_has_many_c
    description: >-
      The notification of every change of t_has_many_c (LCTYSP-0014), made today through the HTTP API (POST
      /v1/conversations/:id/lines with a tags line, and deleting a conversation): one change, one version, one
      t.batch.updated, sent to every connection that receives it. Its records delete the rows that went and put the rows
      that came, in that order; a change that changes no row is sent to nobody.
    paramStructure: by-name
    params:
      - name: version
        required: true
        schema:
          $ref: "#/components/schemas/Version"
      - name: actorId
        required: true
        description: Always null today (no tag is written over /v1/rpc yet)
        schema:
          oneOf:
            - $ref: "#/components/schemas/ActorId"
            - type: "null"
      - name: records
        required: true
        schema:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/TagRecord"

components:
  schemas:
    Meta:
      description: What the list of conversations shows of one, and a row of c_meta in the browser (LCTYSP-0014)
      type: object
      required: [cid, lang, title, titleTypeId, updatedAt, createdAt]
      properties:
        cid:
          $ref: "#/components/schemas/Cid"
        lang:
          type: string
        title:
          type: string
        titleTypeId:
          description: The id of <title> as it is in the file ("__" and the size of the title slot, LCTYSP-0013)
          type: string
        updatedAt:
          $ref: "#/components/schemas/Time"
        createdAt:
          $ref: "#/components/schemas/Time"
    RecordCount:
      description: The number of elements of a conversation, a row of c_recordcount in the browser (LCTYSP-0014)
      type: object
      required: [cid, count]
      properties:
        cid:
          $ref: "#/components/schemas/Cid"
        count:
          description: The number of elements of the file, every one but lcty-c (its lines less 4)
          type: integer
          minimum: 0
    Record:
      description: >-
        One change to one copy in the browser: store names the copy (LCTYSP-0014), op what is done to it, row what it
        is done with
      oneOf:
        - type: object
          required: [store, op, row]
          properties:
            store:
              const: c_meta
            op:
              const: put
            row:
              $ref: "#/components/schemas/Meta"
        - type: object
          required: [store, op, row]
          properties:
            store:
              const: c_recordcount
            op:
              const: put
            row:
              $ref: "#/components/schemas/RecordCount"
        - type: object
          description: A conversation deleted (through the HTTP API) leaves c_meta and c_recordcount
          required: [store, op, row]
          properties:
            store:
              enum: [c_meta, c_recordcount]
            op:
              const: delete
            row:
              type: object
              required: [cid]
              properties:
                cid:
                  $ref: "#/components/schemas/Cid"
        - type: object
          required: [store, op, row]
          properties:
            store:
              const: c_html
            op:
              const: append
            row:
              description: The element as written, and the element it was appended after
              allOf:
                - $ref: "#/components/schemas/Element"
                - type: object
                  required: [cid, after]
                  properties:
                    cid:
                      $ref: "#/components/schemas/Cid"
                    after:
                      oneOf:
                        - $ref: "#/components/schemas/ElementId"
                        - type: "null"
        - type: object
          required: [store, op, row]
          properties:
            store:
              const: c_html
            op:
              const: unappend
            row:
              type: object
              required: [cid, id]
              properties:
                cid:
                  $ref: "#/components/schemas/Cid"
                id:
                  $ref: "#/components/schemas/ElementId"
        - type: object
          description: What c.stats.put recorded of a reply, only to the connections following its conversation
          required: [store, op, row]
          properties:
            store:
              const: c_stats
            op:
              const: put
            row:
              type: object
              required: [cid, id, timings, usage, client]
              properties:
                cid:
                  $ref: "#/components/schemas/Cid"
                id:
                  $ref: "#/components/schemas/ElementId"
                timings:
                  type: [object, "null"]
                usage:
                  type: [object, "null"]
                client:
                  type: [object, "null"]
    TagHasC:
      description: That a tag has a conversation, a row of t_has_many_c (LCTYSP-0014)
      type: object
      required: [tag, cid]
      properties:
        tag:
          description: A reference to a tag, the file-name part of its tag file, which need not exist (LCTYSP-0009)
          type: string
        cid:
          $ref: "#/components/schemas/Cid"
    TagRecord:
      description: One change to t_has_many_c, a row put or deleted
      type: object
      required: [store, op, row]
      properties:
        store:
          const: t_has_many_c
        op:
          enum: [put, delete]
        row:
          $ref: "#/components/schemas/TagHasC"
    Capabilities:
      type: object
      required: [receives]
      properties:
        receives:
          description: The names of the methods this end receives
          type: array
          items:
            type: string
          uniqueItems: true
    ActorId:
      description: The id of a connection, assigned by the server in initialize
      type: string
      format: uuid
    Version:
      description: The global version, "<boot>.<seq>"
      type: string
      pattern: "^[0-9a-f]+\\.[0-9]+$"
    Change:
      type: object
      required: [version]
      properties:
        version:
          $ref: "#/components/schemas/Version"
    Cid:
      type: string
      pattern: "^[A-Za-z0-9_-]{1,80}$"
    Time:
      type: string
      pattern: "^\\d{4}-\\d\\d-\\d\\dT\\d\\d:\\d\\d:\\d\\d(\\.\\d+)?(Z|[+-]\\d\\d:\\d\\d)$"
    ElementId:
      description: A prefix (sys-, mem-, msg-u-, msg-m-, think-, cmd-) and a UUIDv7
      type: string
      pattern: "^(sys|mem|msg-u|msg-m|think|cmd)-[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    Attrs:
      description: The attributes of an element, in their one order (LCTYSP-0013)
      type: object
      additionalProperties:
        type: string
    Element:
      description: >-
        An element as written, without its presentation: no HTML goes to a browser over /v1/rpc, and a page makes the
        presentation from the text in the attributes (LCTYSP-0012)
      type: object
      required: [tag, attrs]
      properties:
        tag:
          type: string
          enum: [lcty-msg, lcty-thinking, lcty-cmd]
        attrs:
          $ref: "#/components/schemas/Attrs"
  errors:
    Conflict:
      code: 1
      message: the last element is not the one named
      data:
        type: object
        properties:
          last:
            description: The id of the last element, or null
            type: [string, "null"]
    Locked:
      code: 2
      message: the conversation is locked by an lcty-cmd
      data:
        type: object
        properties:
          last:
            type: string
    Invalid:
      code: 3
      message: the element breaks a rule of the format
    NotFound:
      code: 4
      message: no such conversation
    Exists:
      code: 5
      message: the conversation exists
    Former:
      code: 6
      message: the conversation is in the format of LCTYSP-0003; convert it with tools/convert.rb
      data:
        type: object
        properties:
          cid:
            type: string
