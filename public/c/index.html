<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lcty</title>
<link rel="stylesheet" href="lcty.v1.css">
<script src="lcty.v1.js"></script>
<script src="lcty.v1.lang-ja.js"></script>
<script type="module" src="index.js"></script>
</head>
<body class="page new">
<lcty-sidebar></lcty-sidebar>
<main class="new-card">
  <h2 data-lcty-t="newChatHeading">New chat</h2>
  <p id="fork-note" class="hint" hidden></p>
  <fieldset>
    <legend data-lcty-t="setupTags">Tags (choosing them fills in a system prompt draft from their prompts and memory)</legend>
    <div id="setup-tags"></div>
  </fieldset>
  <label class="field">
    <span data-lcty-t="systemPrompt">System prompt</span>
    <textarea id="setup-instructions" rows="4" placeholder="(none)" data-lcty-t-placeholder="none"></textarea>
  </label>
  <div><button id="setup-recompose" type="button" hidden data-lcty-t="recompose">Rebuild from the tags</button></div>
  <p class="hint" data-lcty-t="setupHint">The system prompt is fixed when the first message is sent (changing them later would defeat the cache). Tags can be added and removed after starting, but they only work as labels for search.</p>
  <lcty-composer></lcty-composer>
</main>
<div id="toast" role="status" hidden></div>
</body>
</html>
