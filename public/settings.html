<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-lcty-t="settingsPageTitle">Settings - local-chatty</title>
<link rel="stylesheet" href="/c/lcty.v1.css">
<script src="/c/lcty.v1.js"></script>
<script src="/c/lcty.v1.lang-ja.js"></script>
<script>defineLctyV1CustomElements();</script>
<script type="module" src="/settings.js"></script>
</head>
<body class="page">
<lcty-sidebar></lcty-sidebar>
<header class="topbar">
  <strong data-lcty-t="settings">Settings</strong>
</header>
<main class="narrow">
  <p class="hint" data-lcty-t="settingsHint">Settings are stored in this browser. Only the items that differ from the defaults are stored; the rest follow the server's defaults. Saved settings take effect the next time a page loads.</p>
  <form id="settings-form">
    <label class="field"><span data-lcty-t="baseUrlLabel">Server (llama-server)</span><input type="url" name="base_url" required></label>
    <label class="field"><span data-lcty-t="apiKeyLabel">API key</span><input type="text" name="api_key" autocomplete="off" spellcheck="false"></label>
    <label class="field"><span data-lcty-t="chatModelLabel">Chat model</span><input type="text" name="model" required spellcheck="false"></label>
    <label class="field"><span data-lcty-t="embeddingModelLabel">Embedding model (leave empty to turn off semantic search)</span><input type="text" name="embedding_model" spellcheck="false"></label>
    <label><input type="checkbox" name="thinking_kwarg"> <span data-lcty-t="thinkingKwargBefore">Send thinking on/off as</span> <code>chat_template_kwargs.enable_thinking</code><span data-lcty-t="thinkingKwargAfter"></span></label>
    <label><input type="checkbox" name="default_thinking"> <span data-lcty-t="defaultThinkingLabel">Start new chats with thinking on</span></label>
    <p>
      <button type="submit" class="primary" data-lcty-t="save">Save</button>
      <button type="button" id="settings-reset" data-lcty-t="resetDefaults">Reset to defaults</button>
      <button type="button" id="settings-test" data-lcty-t="testConnection">Test connection</button>
    </p>
  </form>
  <p id="settings-status" class="hint"></p>
</main>
<div id="toast" role="status" hidden></div>
</body>
</html>
