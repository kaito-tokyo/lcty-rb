# The backend unit tests (tests/backend, LCTYSP-3xxx) in each dev container, started from its devcontainer.json with the
# Dev Container CLI: .devcontainer/ruby-4.0.10 (the Ruby lcty-rb targets, with Gemfile.lock) and
# .devcontainer/ruby-2.6.10 (macOS's /usr/bin/ruby, with the libraries it has).

name: Backend CI

on:
  pull_request:
    branches: [main]
  workflow_call:

env:
  DEVCONTAINER_CLI: "@devcontainers/cli@0.89.0"

jobs:
  test-backend-ruby:
    name: test-backend (${{ matrix.ruby }})
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        ruby: [ruby-4.0.10, ruby-2.6.10]

    env:
      DEVCONTAINER_CONFIG: .devcontainer/${{ matrix.ruby }}/devcontainer.json

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Start the dev container
        run: npx --yes "$DEVCONTAINER_CLI" up --workspace-folder . --config "$DEVCONTAINER_CONFIG"

      - name: Run backend unit tests
        run: npx --yes "$DEVCONTAINER_CLI" exec --workspace-folder . --config "$DEVCONTAINER_CONFIG" ruby tests/backend/run.rb

  # test-backend, the check the main ruleset requires, passes when every Ruby has
  test-backend:
    needs: test-backend-ruby
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5

    permissions: {}

    steps:
      - name: Check that every Ruby passed
        env:
          RESULT: ${{ needs.test-backend-ruby.result }}
        run: |
          echo "test-backend-ruby: $RESULT"
          [[ "$RESULT" == success ]]
