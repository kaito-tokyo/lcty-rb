version = 1

[*]
n-gpu-layers = all
flash-attn = on
no-mmproj = true
dedup-cache-models = true

; Chat models
[gemma-4-26b-a4b-it]
hf-repo = google/gemma-4-26B-A4B-it-qat-q4_0-gguf
hf-file = gemma-4-26B_q4_0-it.gguf
cache-type-k = f16
cache-type-v = f16
load-mode = mmap+mlock
parallel = 1

; The embedding model is not here: lcty.rb starts a llama-server of its own for it (LCTYSP-0019)
